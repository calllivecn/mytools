
<!DOCTYPE html>
<html>
<head>
	<base id="base-url" href="{{ base_url }}">
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
        .container {
            display: flex;
            justify-content: center;
            /* align-items: center; */
            align-items: flex-start;
            height: 100vh; /* 使用视口单位让容器填满整个高度 */
        }

        .centered-element {
            /* background-color: #f0f0f0; */
            padding: 20px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin: 12px 20px;
        }

        .tabs a {
            padding: 6px 18px;
            border: 1px solid #ccc;
            background: #f8f8f8;
            cursor: pointer;
            color: inherit;
            text-decoration: none;
        }

        .tabs a.active {
            background: #2c7be5;
            color: #fff;
            border-color: #2c7be5;
        }

        .view {
            padding: 0 20px;
        }

        #vault-main .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        #vault-tbody td {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        #vault-tbody td button {
            margin-right: 4px;
        }

        #vault-table {
            border-collapse: collapse;
            width: 100%;
        }

        .mono {
            font-family: monospace;
        }

        /* 弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-mask[hidden] {
            display: none;
        }

        .modal-box {
            background: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            min-width: 320px;
        }

        .modal-box label {
            display: inline-block;
            width: 70px;
            text-align: right;
            margin-right: 8px;
        }

        .modal-box input, .modal-box textarea {
            margin-bottom: 10px;
        }
    </style>

    <script>
        window.VAULT_ENABLED = {{ 'true' if vault_enabled else 'false' }};
    </script>
    <script src="assets/index.js" type="module"></script>

    <title>TOTP / 密码库</title>

</head>
<body>

    <nav class="tabs" id="tabs">
        <a href="#totp" id="tab-totp" class="active">TOTP</a>
        <a href="#vault" id="tab-vault" hidden>密码库</a>
    </nav>

    <!-- TOTP 视图 -->
    <div id="view-totp" class="view">
        <div id="totp-login">
            <div id="totp-login-message" style="color: red;"></div>
            <form id="totp-login-form">
                <label for="totp-login-password">TOTP 密码：</label>
                <input type="password" id="totp-login-password" placeholder="请输入密码">
                <button type="submit">解锁</button>
            </form>
        </div>

        <div id="totp-main" hidden>
            <div class="toolbar">
                <input type="text" id="totp-search" placeholder="搜索名称...">
                <button id="totp-refresh">刷新</button>
                <button id="totp-add-btn">新增</button>
                <button id="totp-lock">锁定</button>
            </div>
            <table id="totp-table">
                <thead><tr><th>名称</th><th>动态密码</th><th>剩余</th><th>操作</th></tr></thead>
                <tbody id="totp-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 密码库视图 -->
    <div id="view-vault" class="view" hidden>
        <div id="vault-login">
            <div id="vault-login-message" style="color: red;"></div>
            <form id="vault-login-form">
                <label for="vault-password">密码库密码：</label>
                <input type="password" id="vault-password" placeholder="请输入密码库密码">
                <button type="submit">解锁</button>
            </form>
        </div>

        <div id="vault-main" hidden>
            <div class="toolbar">
                <input type="text" id="vault-search" placeholder="搜索站点/用户名/备注/分类...">
                <button id="vault-refresh">刷新</button>
                <button id="vault-add-btn">新增</button>
                <button id="vault-chpw-btn">修改主密码</button>
                <button id="vault-lock">锁定</button>
            </div>
            <table id="vault-table">
                <thead><tr><th>站点</th><th>用户名</th><th>密码</th><th>分类</th><th>操作</th></tr></thead>
                <tbody id="vault-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增/编辑条目弹窗 -->
    <div id="vault-modal" class="modal-mask" hidden>
        <form id="vault-form" class="modal-box">
            <input type="hidden" id="vf-id">
            <div><label>站点</label><input type="text" id="vf-site" required></div>
            <div><label>用户名</label><input type="text" id="vf-username"></div>
            <div>
                <label>密码</label><input type="text" id="vf-password" required>
                <button type="button" id="vf-gen">生成</button>
            </div>
            <div><label>分类</label><input type="text" id="vf-category"></div>
            <div><label>备注</label><textarea id="vf-notes" rows="3" cols="24"></textarea></div>
            <div style="text-align:center;">
                <button type="submit" id="vf-save">保存</button>
                <button type="button" id="vf-cancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 修改主密码弹窗 -->
    <div id="vault-pw-modal" class="modal-mask" hidden>
        <form id="vault-pw-form" class="modal-box">
            <div style="margin-bottom:10px;font-size:13px;color:#666;">
                修改主密码是可选的。旧密码为当前主密码，即解锁时输入的密码。
            </div>
            <div><label>旧密码</label><input type="password" id="vpw-old" required></div>
            <div><label>新密码</label><input type="password" id="vpw-new" required></div>
            <div><label>确认新密码</label><input type="password" id="vpw-confirm" required></div>
            <div style="text-align:center;">
                <button type="submit">确定</button>
                <button type="button" id="vpw-cancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 新增/编辑 TOTP 条目弹窗 -->
    <div id="totp-modal" class="modal-mask" hidden>
        <form id="totp-form" class="modal-box">
            <input type="hidden" id="tf-id">
            <div><label>名称</label><input type="text" id="tf-label" required></div>
            <div><label>密钥</label><input type="text" id="tf-secret" placeholder="Base32 密钥"></div>
            <div style="text-align:center;">
                <button type="submit">保存</button>
                <button type="button" id="tf-cancel">取消</button>
            </div>
        </form>
    </div>

</body>
</html>
