
<!DOCTYPE html>
<html>
<head>
	<base id="base-url" href="{{ base_url }}">
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #eef1f5;
            color: #333;
        }

        .page-header {
            text-align: center;
            padding: 18px 20px 0;
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
        }

        /* 顶部 Tab */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 14px 20px 20px;
        }

        .tabs a {
            padding: 8px 28px;
            border: 1px solid #d0d7de;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: all .15s ease;
        }

        .tabs a:hover { border-color: #2c7be5; color: #2c7be5; }

        .tabs a.active {
            background: #2c7be5;
            color: #fff;
            border-color: #2c7be5;
        }

        .view {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 20px 30px;
        }

        /* 卡片 */
        .card {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
        }

        .login-card {
            max-width: 360px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        }

        .login-card label {
            font-size: 14px;
            color: #555;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            margin: 8px 0 14px;
            font-size: 14px;
        }

        .login-card .form-actions { text-align: right; }

        /* 通用按钮 */
        button {
            padding: 7px 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #f6f8fa;
            color: #333;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s ease, border-color .15s ease;
        }

        button:hover { background: #eaeef2; border-color: #b6bec9; }

        button.primary {
            background: #2c7be5;
            border-color: #2c7be5;
            color: #fff;
        }

        button.primary:hover { background: #1f66c4; border-color: #1f66c4; }

        button.danger:hover { background: #e5484d; border-color: #e5484d; color: #fff; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .toolbar input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 8px 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
        }

        /* 表格 */
        table.data-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        table.data-table thead th {
            background: #f6f8fa;
            border-bottom: 2px solid #e1e4e8;
            padding: 10px 12px;
            text-align: left;
            color: #555;
            font-weight: 600;
        }

        table.data-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: middle;
        }

        table.data-table tbody tr:hover { background: #f6f9ff; }

        table.data-table tbody td button { margin-right: 4px; }

        .mono {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        /* 弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-mask[hidden] {
            display: none;
        }

        .modal-box {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 22px;
            min-width: 340px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
        }

        .modal-box label {
            display: inline-block;
            width: 72px;
            text-align: right;
            margin-right: 8px;
            color: #555;
            font-size: 14px;
        }

        .modal-box input, .modal-box textarea {
            padding: 8px 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* 纵向堆叠的表单行（TOTP 弹窗用，输入框更大） */
        .modal-box .form-row { margin-bottom: 14px; }

        .modal-box .form-row label {
            display: block;
            width: auto;
            text-align: left;
            margin: 0 0 5px;
            font-size: 13px;
            color: #666;
        }

        .modal-box .form-row input,
        .modal-box .form-row textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0;
        }

        .modal-box .form-row textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-actions { text-align: center; margin-top: 10px; }
        .form-actions button { margin: 0 6px; }
    </style>

    <script src="assets/index.js" type="module"></script>

    <title>TOTP / 密码库</title>

</head>
<body>

    <div class="page-header">我的工具</div>

    <nav class="tabs" id="tabs">
        <a href="#totp" id="tab-totp" class="active">TOTP</a>
        <a href="#vault" id="tab-vault">密码库</a>
    </nav>

    <!-- TOTP 视图 -->
    <div id="view-totp" class="view">
        <div id="totp-login" class="login-card">
            <div id="totp-login-message" style="color: red; margin-bottom: 6px;"></div>
            <div id="totp-init-hint" style="display:none; color:#666; margin-bottom:8px;">首次使用，请设置主密码并输入3次确认</div>
            <form id="totp-login-form">
                <label for="totp-login-password">TOTP 密码：</label>
                <input type="password" id="totp-login-password" placeholder="请输入密码">
                <div id="totp-confirm-field" hidden>
                    <input type="password" id="totp-login-password2" placeholder="请再次输入密码">
                    <input type="password" id="totp-login-password3" placeholder="请第三次输入密码">
                </div>
                <div class="form-actions">
                    <button type="submit" class="primary" id="totp-login-submit">解锁</button>
                </div>
            </form>
        </div>

        <div id="totp-main" class="card" hidden>
            <div class="toolbar">
                <input type="text" id="totp-search" placeholder="搜索名称...">
                <button id="totp-refresh">刷新</button>
                <button id="totp-add-btn" class="primary">新增</button>
                <button id="totp-lock">锁定</button>
            </div>
            <table id="totp-table" class="data-table">
                <thead><tr><th>名称</th><th>说明</th><th>动态密码</th><th>剩余</th><th>操作</th></tr></thead>
                <tbody id="totp-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 密码库视图 -->
    <div id="view-vault" class="view" hidden>
        <div id="vault-login" class="login-card">
            <div id="vault-login-message" style="color: red; margin-bottom: 6px;"></div>
            <div id="vault-init-hint" style="display:none; color:#666; margin-bottom:8px;">首次使用，请设置主密码并输入3次确认</div>
            <form id="vault-login-form">
                <label for="vault-password">密码库密码：</label>
                <input type="password" id="vault-password" placeholder="请输入密码">
                <div id="vault-confirm-field" hidden>
                    <input type="password" id="vault-password2" placeholder="请再次输入密码">
                    <input type="password" id="vault-password3" placeholder="请第三次输入密码">
                </div>
                <div class="form-actions">
                    <button type="submit" class="primary" id="vault-login-submit">解锁</button>
                </div>
            </form>
        </div>

        <div id="vault-main" class="card" hidden>
            <div class="toolbar">
                <input type="text" id="vault-search" placeholder="搜索站点/用户名/备注/分类...">
                <button id="vault-refresh">刷新</button>
                <button id="vault-add-btn" class="primary">新增</button>
                <button id="vault-chpw-btn">修改主密码</button>
                <button id="vault-lock">锁定</button>
            </div>
            <table id="vault-table" class="data-table">
                <thead><tr><th>站点</th><th>用户名</th><th>密码</th><th>分类</th><th>操作</th></tr></thead>
                <tbody id="vault-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增/编辑条目弹窗 -->
    <div id="vault-modal" class="modal-mask" hidden>
        <form id="vault-form" class="modal-box">
            <input type="hidden" id="vf-id">
            <div><label>站点</label><input type="text" id="vf-site" required></div>
            <div><label>用户名</label><input type="text" id="vf-username"></div>
            <div>
                <label>密码</label><input type="text" id="vf-password" required>
                <button type="button" id="vf-gen">生成</button>
            </div>
            <div><label>分类</label><input type="text" id="vf-category"></div>
            <div><label>备注</label><textarea id="vf-notes" rows="3" cols="24"></textarea></div>
            <div style="text-align:center;">
                <button type="submit" id="vf-save">保存</button>
                <button type="button" id="vf-cancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 修改主密码弹窗 -->
    <div id="vault-pw-modal" class="modal-mask" hidden>
        <form id="vault-pw-form" class="modal-box">
            <div style="margin-bottom:10px;font-size:13px;color:#666;">
                修改主密码是可选的。旧密码为当前主密码，即解锁时输入的密码。
            </div>
            <div><label>旧密码</label><input type="password" id="vpw-old" required></div>
            <div><label>新密码</label><input type="password" id="vpw-new" required></div>
            <div><label>确认新密码</label><input type="password" id="vpw-confirm" required></div>
            <div style="text-align:center;">
                <button type="submit">确定</button>
                <button type="button" id="vpw-cancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 新增/编辑 TOTP 条目弹窗 -->
    <div id="totp-modal" class="modal-mask" hidden>
        <form id="totp-form" class="modal-box">
            <input type="hidden" id="tf-id">
            <div class="form-row"><label>名称</label><input type="text" id="tf-label" required></div>
            <div class="form-row"><label>密钥</label><input type="text" id="tf-secret" placeholder="Base32 密钥"></div>
            <div class="form-row"><label>说明</label><textarea id="tf-notes" rows="2" placeholder="可选"></textarea></div>
            <div class="form-row"><label>附加信息</label><textarea id="tf-secret-info" rows="4" placeholder="可选，如恢复码等（加密保存）"></textarea></div>
            <div class="form-actions">
                <button type="submit" class="primary">保存</button>
                <button type="button" id="tf-cancel">取消</button>
            </div>
        </form>
    </div>

    <!-- 查看 TOTP 附加信息弹窗 -->
    <div id="totp-info-modal" class="modal-mask" hidden>
        <div class="modal-box">
            <div style="font-weight:bold;" id="ti-label"></div>
            <div style="margin-top:8px;color:#666;">说明</div>
            <div id="ti-notes"></div>
            <div style="margin-top:8px;color:#666;">附加信息</div>
            <pre id="ti-secret-info" style="white-space:pre-wrap;word-break:break-all;min-width:260px;"></pre>
            <div style="text-align:center;margin-top:10px;">
                <button type="button" id="ti-copy">复制</button>
                <button type="button" id="ti-close">关闭</button>
            </div>
        </div>
    </div>

</body>
</html>
